<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>图片裁剪 · 画布交互原型</title>
  <style>
    :root{color-scheme:dark;--bg:#0d0e0f;--panel:#202124;--panel2:#28292d;--line:rgba(255,255,255,.1);--text:rgba(255,255,255,.9);--muted:rgba(255,255,255,.48);--mint:#00e5b7;--nodew:420px;--nodeh:310px}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px}button,input{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
    .app{position:relative;width:100%;height:100%;overflow:auto;background-color:#101112;background-image:radial-gradient(circle,rgba(255,255,255,.095) 1px,transparent 1.2px);background-size:22px 22px}
    .world{position:relative;width:1900px;height:1080px;transform-origin:0 0}
    .topbar{position:sticky;top:0;left:0;z-index:50;width:100vw;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:rgba(19,20,22,.92);border-bottom:1px solid rgba(255,255,255,.07);backdrop-filter:blur(16px)}
    .brand{display:flex;align-items:center;gap:10px;font-weight:650}.brand-mark{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#f4f4f3;color:#101112;font-weight:800}.crumb{color:var(--muted);font-weight:450}.top-actions{display:flex;align-items:center;gap:10px}.balance,.publish{height:32px;border:1px solid rgba(255,255,255,.12);border-radius:8px;background:#242529;padding:0 11px}.balance{color:rgba(255,255,255,.62)}.publish{background:#f3f3f2;color:#171719;font-weight:650}
    .rail{position:fixed;left:14px;top:74px;z-index:45;display:flex;flex-direction:column;gap:5px;padding:7px;border:1px solid rgba(255,255,255,.09);border-radius:12px;background:rgba(29,30,33,.9);box-shadow:0 12px 36px rgba(0,0,0,.34);backdrop-filter:blur(14px)}
    .rail button{width:36px;height:36px;border:0;border-radius:8px;background:transparent;display:grid;place-items:center;color:rgba(255,255,255,.6)}.rail button:first-child{background:rgba(255,255,255,.1);color:#fff}.rail button:hover{background:rgba(255,255,255,.08)}.rail svg{width:18px;height:18px}
    .canvas-note{position:absolute;left:92px;top:92px;color:rgba(255,255,255,.34);font-size:12px}.canvas-note b{color:rgba(255,255,255,.68);font-weight:550}
    #wires{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:visible}.wire{fill:none;stroke:rgba(150,154,160,.58);stroke-width:2.2}.wire.active{stroke:rgba(0,229,183,.8)}
    .node-wrap{position:absolute;z-index:5}.source-wrap{left:250px;top:245px;width:var(--nodew)}
    .image-node{position:relative;width:var(--nodew);border-radius:12px;background:#18191b;border:1px solid rgba(255,255,255,.15);box-shadow:0 18px 44px rgba(0,0,0,.32);overflow:hidden}.image-node.selected{border-color:rgba(255,255,255,.52);box-shadow:0 0 0 1px rgba(255,255,255,.15),0 20px 50px rgba(0,0,0,.45)}
    .node-title{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#1c1d20;border-bottom:1px solid rgba(255,255,255,.08)}.node-title strong{font-size:13px;font-weight:580}.node-title span{font-size:11px;color:var(--muted)}
    .photo-stage{position:relative;width:100%;height:var(--nodeh);overflow:hidden;background:#272a2c;user-select:none}.photo{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none}.node-footer{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:rgba(255,255,255,.42);font-size:11px}
    .port{position:absolute;right:-6px;top:calc(42px + var(--nodeh)/2);width:12px;height:12px;border:2px solid #9da0a3;background:#242529;border-radius:50%;z-index:4}
    .toolbar{position:absolute;left:50%;bottom:calc(100% + 12px);z-index:25;display:flex;align-items:center;gap:2px;height:44px;padding:4px;border:1px solid rgba(255,255,255,.11);border-radius:10px;background:rgba(31,32,35,.94);box-shadow:0 14px 32px rgba(0,0,0,.36);backdrop-filter:blur(18px);white-space:nowrap;transform:translateX(-50%)}
    .toolbar[hidden]{display:none}.toolbtn{height:34px;border:0;border-radius:7px;background:transparent;padding:0 9px;display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.75);font-size:12px}.toolbtn:hover,.toolbtn.active{background:rgba(255,255,255,.1);color:#fff}.toolbtn svg{width:17px;height:17px;flex:none}.toolbtn.icon{width:34px;padding:0;justify-content:center}.toolbtn.crop img{width:17px;height:17px;opacity:.82}.sep{width:1px;height:20px;background:rgba(255,255,255,.1);margin:0 2px}
    .anchored-menu{position:absolute;z-index:35;width:230px;padding:7px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(31,32,35,.98);box-shadow:0 18px 44px rgba(0,0,0,.48);backdrop-filter:blur(18px);animation:menuin .12s ease-out}.anchored-menu[hidden]{display:none}@keyframes menuin{from{opacity:0;transform:translateY(-4px) scale(.985)}to{opacity:1;transform:none}}
    #grid-menu,#grid-action-menu,#custom-menu{left:132px;top:-2px;bottom:auto}.menu-head{height:34px;display:flex;align-items:center;gap:7px;padding:0 8px;color:rgba(255,255,255,.68);font-size:12px;border-bottom:1px solid rgba(255,255,255,.08);margin:0 0 5px}.menu-item{width:100%;min-height:48px;border:0;border-radius:8px;background:transparent;display:grid;grid-template-columns:32px 1fr;align-items:center;text-align:left;padding:6px 8px}.menu-item:hover{background:rgba(255,255,255,.08)}.menu-icon{width:26px;height:26px;border-radius:6px;background:rgba(255,255,255,.06);display:grid;place-items:center;color:rgba(255,255,255,.66)}.menu-icon svg{width:16px;height:16px}.menu-copy strong{display:block;font-size:12px;font-weight:580;color:rgba(255,255,255,.88)}.menu-copy span{display:block;margin-top:2px;color:rgba(255,255,255,.38);font-size:11px}.menu-caret{position:absolute;right:14px;color:rgba(255,255,255,.28)}
    .custom-form{padding:9px}.custom-hint{margin:2px 0 12px;color:rgba(255,255,255,.5);font-size:12px}.dimension-row{display:grid;grid-template-columns:1fr 18px 1fr;align-items:end;gap:6px}.dimension-row label{display:grid;gap:6px;color:rgba(255,255,255,.42);font-size:11px}.dimension-row input{width:100%;height:34px;border:1px solid rgba(255,255,255,.14);border-radius:7px;background:#17181a;color:#fff;padding:0 9px}.times{height:34px;display:grid;place-items:center;color:rgba(255,255,255,.35)}.custom-confirm{width:100%;height:34px;margin-top:12px;border:0;border-radius:7px;background:#f3f3f2;color:#171719;font-weight:650}
    .crop-layer{position:absolute;inset:0;z-index:16;touch-action:none}.crop-layer[hidden]{display:none}.crop-mask{position:absolute;inset:0;background:rgba(0,0,0,.54);pointer-events:none}.crop-box{position:absolute;border:1.5px solid rgba(255,255,255,.98);cursor:move;box-shadow:0 0 0 1px rgba(0,0,0,.3)}.thirds{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 33.2%,rgba(255,255,255,.72) 33.35%,rgba(255,255,255,.72) 33.55%,transparent 33.7%,transparent 66.25%,rgba(255,255,255,.72) 66.4%,rgba(255,255,255,.72) 66.6%,transparent 66.75%),linear-gradient(0deg,transparent 33.2%,rgba(255,255,255,.72) 33.35%,rgba(255,255,255,.72) 33.55%,transparent 33.7%,transparent 66.25%,rgba(255,255,255,.72) 66.4%,rgba(255,255,255,.72) 66.6%,transparent 66.75%)}
    .handle{position:absolute;width:12px;height:12px;background:#fff;border:2px solid #232427;border-radius:50%}.handle.nw{left:-7px;top:-7px;cursor:nwse-resize}.handle.ne{right:-7px;top:-7px;cursor:nesw-resize}.handle.sw{left:-7px;bottom:-7px;cursor:nesw-resize}.handle.se{right:-7px;bottom:-7px;cursor:nwse-resize}.crop-size{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);padding:5px 9px;border-radius:8px;background:rgba(20,21,23,.72);color:rgba(255,255,255,.86);font-size:11px;white-space:nowrap;pointer-events:none}
    .crop-actions{position:absolute;z-index:30;left:50%;top:calc(100% + 12px);height:48px;padding:6px;display:flex;align-items:center;gap:2px;border:1px solid rgba(255,255,255,.09);border-radius:48px;background:rgba(34,35,38,.92);box-shadow:0 8px 24px rgba(0,0,0,.35);backdrop-filter:blur(16px);transform:translateX(-50%)}.crop-actions[hidden]{display:none}.crop-action{height:36px;border:0;border-radius:18px;background:transparent;display:grid;place-items:center;color:rgba(255,255,255,.72)}.crop-action.icon{width:36px}.crop-action.ratio{width:89px;grid-template-columns:18px auto;gap:6px;padding:0 9px}.crop-action:hover{background:rgba(255,255,255,.08);color:#fff}.crop-action.confirm{color:var(--mint);background:rgba(0,229,183,.16)}.crop-action.confirm.loading svg{animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.crop-action svg{width:17px;height:17px}
    #ratio-menu{left:50%;bottom:auto;top:calc(100% + 66px);width:120px;transform:translateX(-50%);padding:5px}.ratio-option{width:100%;height:29px;border:0;border-radius:6px;background:transparent;text-align:left;padding:0 10px;color:rgba(255,255,255,.85)}.ratio-option:hover,.ratio-option.selected{background:rgba(255,255,255,.09)}
    .result-node{position:absolute;z-index:4;width:270px;border:1px solid rgba(255,255,255,.14);border-radius:10px;background:#191a1d;box-shadow:0 16px 36px rgba(0,0,0,.32);animation:resultin .28s ease-out}@keyframes resultin{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}.result-node .node-title{height:36px}.result-node .preview{height:176px;overflow:hidden}.result-node .preview img{width:100%;height:100%;object-fit:cover}.result-node .node-footer{height:28px}.result-node .port-in{position:absolute;left:-6px;top:112px;width:12px;height:12px;border:2px solid #9da0a3;background:#242529;border-radius:50%}
    .grid-group{position:absolute;z-index:4;padding:10px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(93,95,101,.24);box-shadow:0 18px 44px rgba(0,0,0,.26);animation:resultin .28s ease-out}.group-title{height:28px;display:flex;align-items:flex-start;justify-content:space-between;color:rgba(255,255,255,.78);font-size:12px}.group-title span:last-child{color:rgba(255,255,255,.36)}.grid-results{display:grid;gap:8px}.cell-node{position:relative;width:176px;height:134px;border:1px solid rgba(255,255,255,.13);border-radius:8px;background:#17181a;overflow:hidden}.cell-node strong{height:26px;display:flex;align-items:center;padding:0 8px;font-size:10px;font-weight:520;color:rgba(255,255,255,.67)}.cell-node img{width:100%;height:108px;display:block;object-fit:cover}.cell-node .crop-pos{position:absolute;inset:26px 0 0;background-repeat:no-repeat}.group-port{position:absolute;left:-6px;top:50%;width:12px;height:12px;border:2px solid #9da0a3;background:#242529;border-radius:50%}
    .toast{position:fixed;z-index:80;right:20px;bottom:20px;max-width:360px;padding:10px 13px;border:1px solid rgba(255,255,255,.12);border-radius:9px;background:rgba(35,36,39,.96);box-shadow:0 12px 32px rgba(0,0,0,.34);color:rgba(255,255,255,.8);transition:.16s}.toast[hidden]{opacity:0;transform:translateY(8px);pointer-events:none}.hint{position:fixed;z-index:40;left:16px;bottom:14px;color:rgba(255,255,255,.32);font-size:11px;background:rgba(18,19,21,.72);padding:6px 9px;border-radius:6px}.hint b{color:rgba(255,255,255,.58);font-weight:520}
    @media(max-width:700px){.world{width:1600px}.topbar{min-width:920px}.source-wrap{left:145px}.rail{left:10px}.canvas-note{left:76px}.hint{display:none}}
  </style>
</head>
<body>
  <main class="app" id="app">
    <div class="topbar">
      <div class="brand"><span class="brand-mark">R</span><span>图片工作流</span><span class="crumb">/ 无标题画布</span></div>
      <div class="top-actions"><button class="balance">余额 0.09</button><button class="publish">分享</button></div>
    </div>
    <nav class="rail" aria-label="画布工具">
      <button title="选择"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m6 3 11 8-6 2 3 6-2 1-3-6-4 4z"/></svg></button>
      <button title="平移"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 11V6a2 2 0 0 1 4 0v4-6a2 2 0 0 1 4 0v6-4a2 2 0 0 1 4 0v8a7 7 0 0 1-7 7h-1a7 7 0 0 1-6-3l-3-4a2 2 0 0 1 3-3l2 2"/></svg></button>
      <button title="图片"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 15-5-5L5 20"/></svg></button>
      <button title="添加"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></button>
    </nav>
    <div class="world" id="world">
      <div class="canvas-note"><b>图片裁剪工作流</b> · 选中图片节点开始编辑</div>
      <svg id="wires" width="1900" height="1080" aria-hidden="true"></svg>
      <section class="node-wrap source-wrap" id="source-wrap">
        <div class="toolbar" id="toolbar">
          <button class="toolbtn">人物调节</button><button class="toolbtn">全景图</button><span class="sep"></span>
          <button class="toolbtn" id="grid-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18M6 3v18M12 3v18M18 3v18"/></svg>宫格裁剪</button>
          <button class="toolbtn icon crop" id="crop-btn" title="裁剪"><img alt="" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAAXNSR0IArs4c6QAAAARzQklUCAgICHwIZIgAAAFsSURBVFiF7ZYxbsIwFIb/FyqRkRuUSFXIm0r3DuUG9AbhBr0B9AQcAW7Q3qAduhcmg1Up9AaMmfw6YKSoErFBgQgp/2Tl/bE/2S9/DDikte4rpbou36kKyopKqYkx5puI3moBCILg1g77tQBcQg1A7QAE2+2FhivqUUTuAICI5j4TishSRN6ZeeMFoJR6IqKPI8F9QF6ZeeLyBWEYLgB40R4jIhprradOX1lxvV7PRCQFgCRJSr0AkGVZJ8/zIRGNAXSx24kBM38eeqfSJoyiaMvMcxEZ7Z8RUWmIneUrsMe6B7i/OEAURVtfb+050AA0AN4AWZZ1Lg4gIsv9OM/zs9yKXADFQJkppdKqd8KZ71rrqTHmpcpFrTbtdvvBCQB7X7A/mEolIgMvAAvRJaKhK9sLk6fYHd0PgK//dWPMLzNPvAGO1Wq1Egsw7/V6o0O+68mBBuAaARaw3V5mujnX6iLy3Gq1OnEcL8p8f23vgp/d86WVAAAAAElFTkSuQmCC"></button>
          <span class="sep"></span><button class="toolbtn icon" title="下载"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v12m-4-4 4 4 4-4M5 19h14"/></svg></button>
        </div>
        <div class="anchored-menu" id="grid-menu" hidden></div>
        <div class="anchored-menu" id="grid-action-menu" hidden></div>
        <div class="anchored-menu" id="custom-menu" hidden></div>
        <article class="image-node selected" id="source-node">
          <header class="node-title"><strong>图片结果</strong><span>已完成</span></header>
          <div class="photo-stage" id="photo-stage"><img class="photo" src="assets/source-image.webp" alt="摩托车场景源图">
            <div class="crop-layer" id="crop-layer" hidden><div class="crop-mask"></div><div class="crop-box" id="crop-box"><span class="thirds"></span><span class="handle nw" data-handle="nw"></span><span class="handle ne" data-handle="ne"></span><span class="handle sw" data-handle="sw"></span><span class="handle se" data-handle="se"></span></div><span class="crop-size" id="crop-size">2850 × 2100 · 裁剪</span></div>
          </div>
          <footer class="node-footer"><span>3840 × 2850</span><span>PNG</span></footer><span class="port"></span>
        </article>
        <div class="crop-actions" id="crop-actions" hidden>
          <button class="crop-action icon" id="crop-cancel" title="取消 (ESC)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
          <button class="crop-action ratio" id="ratio-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 4h5M4 5v5M19 20h-5M20 19v-5"/><rect x="6" y="7" width="12" height="10" rx="2"/></svg><span>宽高比</span></button>
          <button class="crop-action icon confirm" id="crop-confirm" title="确认裁剪"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3v14a2 2 0 0 0 2 2h12M3 7h14a2 2 0 0 1 2 2v12"/></svg></button>
        </div>
        <div class="anchored-menu" id="ratio-menu" hidden></div>
      </section>
    </div>
    <div class="hint"><b>操作提示</b>：拖动裁剪框 · Esc 取消 · 结果自动连接到原图</div>
    <div class="toast" id="toast" role="status" hidden></div>
  </main>
  <script>
    const $=s=>document.querySelector(s);const world=$('#world'),sourceWrap=$('#source-wrap'),toolbar=$('#toolbar'),gridMenu=$('#grid-menu'),gridAction=$('#grid-action-menu'),customMenu=$('#custom-menu'),cropLayer=$('#crop-layer'),cropBox=$('#crop-box'),cropActions=$('#crop-actions'),ratioMenu=$('#ratio-menu'),toast=$('#toast');
    const state={mode:'idle',crop:{x:12,y:11,w:74,h:74,ratio:null},grid:null,results:[],nextX:810};let drag=null,toastTimer=null;
    const gridIcon=n=>`<span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 3h18v18H3zM${3+18/n} 3v18M3 ${3+18/n}h18${n>2?`M${3+36/n} 3v18M3 ${3+36/n}h18`:''}${n>3?`M${3+54/n} 3v18M3 ${3+54/n}h18`:''}"/></svg></span>`;
    function showToast(message){toast.textContent=message;toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,2600)}
    function closeMenus(){gridMenu.hidden=true;gridAction.hidden=true;customMenu.hidden=true;ratioMenu.hidden=true;$('#grid-btn').classList.remove('active')}
    function enterCrop(){closeMenus();state.mode='crop';toolbar.hidden=true;cropLayer.hidden=false;cropActions.hidden=false;renderCrop()}
    function exitCrop(message){state.mode='idle';cropLayer.hidden=true;cropActions.hidden=true;ratioMenu.hidden=true;toolbar.hidden=false;if(message)showToast(message)}
    function renderCrop(){const c=state.crop;cropBox.style.cssText=`left:${c.x}%;top:${c.y}%;width:${c.w}%;height:${c.h}%`;const width=Math.round(3840*c.w/100),height=Math.round(2850*c.h/100);$('#crop-size').textContent=`${width} × ${height} · 裁剪`}
    function setRatio(ratio){const c=state.crop,[rw,rh]=ratio.split(':').map(Number),stageRatio=420/310,wanted=rw/rh;c.ratio=ratio;if(wanted>stageRatio){c.w=76;c.h=c.w*stageRatio/wanted}else{c.h=76;c.w=c.h*wanted/stageRatio}c.x=(100-c.w)/2;c.y=(100-c.h)/2;renderCrop();renderRatios()}
    function renderRatios(){ratioMenu.innerHTML=['1:1','4:3','3:4','16:9','9:16'].map(r=>`<button class="ratio-option ${state.crop.ratio===r?'selected':''}" data-ratio="${r}">${r}</button>`).join('')}
    function showGridMenu(){closeMenus();state.mode='menu';$('#grid-btn').classList.add('active');gridMenu.hidden=false;gridMenu.innerHTML=[{n:2,title:'4宫格裁剪',sub:'2×2 网格'},{n:3,title:'9宫格裁剪',sub:'3×3 网格'},{n:4,title:'16宫格裁剪',sub:'4×4 网格'},{n:5,title:'25宫格裁剪',sub:'5×5 网格'}].map(x=>`<button class="menu-item" data-grid="${x.n}">${gridIcon(x.n)}<span class="menu-copy"><strong>${x.title}</strong><span>${x.sub}</span></span></button>`).join('')+`<button class="menu-item" data-grid="custom">${gridIcon(3)}<span class="menu-copy"><strong>自定义宫格裁剪</strong><span>自定义行 × 列</span></span></button>`}
    function showGridAction(value){gridMenu.hidden=true;state.grid=value;gridAction.hidden=false;const title=value==='custom'?'自定义宫格裁剪':`${value*value}宫格裁剪`;gridAction.innerHTML=`<div class="menu-head">← ${title}</div><button class="menu-item" data-action="crop">${gridIcon(2)}<span class="menu-copy"><strong>仅裁剪</strong><span>创建独立图片节点</span></span></button><button class="menu-item" data-action="story">${gridIcon(3)}<span class="menu-copy"><strong>创建分镜格子</strong><span>自动填充到分镜节点</span></span></button>`}
    function showCustom(){gridAction.hidden=true;customMenu.hidden=false;customMenu.innerHTML=`<div class="menu-head">← 仅裁剪</div><form class="custom-form" id="custom-form"><p class="custom-hint">请选择裁剪宫格（行 × 列）</p><div class="dimension-row"><label>行<input name="rows" type="number" min="1" max="20" value="3"></label><span class="times">×</span><label>列<input name="cols" type="number" min="1" max="20" value="3"></label></div><button class="custom-confirm">确认</button></form>`}
    function makeWire(x,y){const sourceX=670,sourceY=442;const mid=(sourceX+x)/2;return `<path class="wire active" d="M${sourceX} ${sourceY} C${mid} ${sourceY},${mid} ${y},${x} ${y}"/>`}
    function updateWires(){const svg=$('#wires');svg.innerHTML=state.results.map(r=>makeWire(r.x,r.y)).join('')}
    function addCropResult(){const c={...state.crop},x=state.nextX,y=310+state.results.length*250;state.nextX=Math.min(1250,state.nextX+30);const el=document.createElement('article');el.className='result-node';el.style=`left:${x}px;top:${y}px`;el.innerHTML=`<span class="port-in"></span><header class="node-title"><strong>裁剪</strong><span>已完成</span></header><div class="preview"><img src="assets/source-image.webp" alt="裁剪结果" style="transform:scale(${100/c.w});transform-origin:${c.x+c.w/2}% ${c.y+c.h/2}%"></div><footer class="node-footer"><span>${Math.round(3840*c.w/100)} × ${Math.round(2850*c.h/100)}</span><span>图片结果</span></footer>`;world.append(el);state.results.push({x,y:y+112});updateWires();showToast('已生成“裁剪”下游图片节点')}
    function cellStyle(rows,cols,r,c){return `background-image:url('assets/source-image.webp');background-size:${cols*100}% ${rows*100}%;background-position:${cols===1?0:c/(cols-1)*100}% ${rows===1?0:r/(rows-1)*100}%;`}
    function addGridResult(rows,cols){const count=rows*cols,x=800,y=210+state.results.length*72,width=cols*184+12,height=38+rows*142;world.style.width=`${Math.max(1900,x+width+80)}px`;world.style.height=`${Math.max(1080,y+height+80)}px`;const group=document.createElement('section');group.className='grid-group';group.style=`left:${x}px;top:${y}px;width:${width}px;min-height:${height}px`;group.innerHTML=`<span class="group-port"></span><div class="group-title"><strong>${count}宫格裁剪</strong><span>${rows}×${cols}</span></div><div class="grid-results" style="grid-template-columns:repeat(${cols},176px)">${Array.from({length:count},(_,i)=>{const r=Math.floor(i/cols),c=i%cols;return `<div class="cell-node"><strong>裁剪 ${r+1}-${c+1}</strong><span class="crop-pos" style="${cellStyle(rows,cols,r,c)}"></span></div>`}).join('')}</div>`;world.append(group);state.results.push({x,y:y+height/2});updateWires();showToast(`已创建 ${count} 个独立图片节点`)}
    $('#crop-btn').addEventListener('click',e=>{e.stopPropagation();enterCrop()});$('#grid-btn').addEventListener('click',e=>{e.stopPropagation();showGridMenu()});
    $('#crop-cancel').addEventListener('click',()=>exitCrop('已取消裁剪，原图未变更'));$('#ratio-btn').addEventListener('click',e=>{e.stopPropagation();renderRatios();ratioMenu.hidden=!ratioMenu.hidden});ratioMenu.addEventListener('click',e=>{const b=e.target.closest('[data-ratio]');if(b){setRatio(b.dataset.ratio);ratioMenu.hidden=true}});
    $('#crop-confirm').addEventListener('click',()=>{const b=$('#crop-confirm');b.classList.add('loading');b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8" stroke-opacity=".25"/><path d="M20 12a8 8 0 0 0-8-8"/></svg>';setTimeout(()=>{b.classList.remove('loading');b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3v14a2 2 0 0 0 2 2h12M3 7h14a2 2 0 0 1 2 2v12"/></svg>';addCropResult();exitCrop()},720)});
    gridMenu.addEventListener('click',e=>{const b=e.target.closest('[data-grid]');if(b)showGridAction(b.dataset.grid==='custom'?'custom':Number(b.dataset.grid))});gridAction.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='story'){closeMenus();showToast('分镜分支不在本次图片裁剪原型范围内');return}if(state.grid==='custom')showCustom();else{const n=state.grid;closeMenus();addGridResult(n,n)}});customMenu.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target),rows=Math.min(20,Math.max(1,Number(fd.get('rows')))),cols=Math.min(20,Math.max(1,Number(fd.get('cols'))));closeMenus();addGridResult(rows,cols)});
    cropBox.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();const r=$('#photo-stage').getBoundingClientRect(),c={...state.crop};drag={type:e.target.dataset.handle||'move',sx:e.clientX,sy:e.clientY,r,c};cropBox.setPointerCapture(e.pointerId)});cropBox.addEventListener('pointermove',e=>{if(!drag)return;const dx=(e.clientX-drag.sx)/drag.r.width*100,dy=(e.clientY-drag.sy)/drag.r.height*100,c=state.crop,o=drag.c;if(drag.type==='move'){c.x=Math.max(0,Math.min(100-o.w,o.x+dx));c.y=Math.max(0,Math.min(100-o.h,o.y+dy))}else{let nx=o.x,ny=o.y,nw=o.w,nh=o.h;if(drag.type.includes('e'))nw=Math.max(12,Math.min(100-o.x,o.w+dx));if(drag.type.includes('s'))nh=Math.max(12,Math.min(100-o.y,o.h+dy));if(drag.type.includes('w')){nx=Math.max(0,Math.min(o.x+o.w-12,o.x+dx));nw=o.w+(o.x-nx)}if(drag.type.includes('n')){ny=Math.max(0,Math.min(o.y+o.h-12,o.y+dy));nh=o.h+(o.y-ny)}c.x=nx;c.y=ny;c.w=nw;c.h=nh;c.ratio=null}renderCrop()});cropBox.addEventListener('pointerup',()=>drag=null);
    document.addEventListener('click',e=>{if(!e.target.closest('.toolbar,.anchored-menu,.crop-actions'))closeMenus()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.mode==='crop')exitCrop('已取消裁剪，原图未变更');else closeMenus()}});updateWires();
  </script>
</body>
</html>
